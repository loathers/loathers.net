version: 2
updates:
  # Once a quarter, one PR with every npm minor & patch update. Major versions 
  # (like future Astro 8) still arrive as their own PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: quarterly
    # Require versions out for 2+ weeks, to avoid broken/hijacked releases
    cooldown:
      default-days: 14
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # @astrojs/check only supports TypeScript 5 & 6; drop once it supports 7
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # Keeps the actions in .github/workflows current, before GitHub retires the
  # Node versions old releases run on
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  # No docker entry; CI pulls fresh node/nginx, Coolify probably does, 
  # dependabot is overkill for static site.

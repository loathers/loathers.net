# Posts whose slugs changed, from old address to new. Each pattern starts with
# ~ so it matches case-sensitively; plain map strings ignore case, which would
# send the new lowercase address back to itself forever. The /? lets the old
# address match with or without its trailing slash.
map $uri $renamed_post {
    "~^/analysis/2026-02-Heartstone/?$"            /analysis/2026-02-heartstone/;
    "~^/analysis/2026-04-Baseball-Diamond/?$"      /analysis/2026-04-baseball-diamond/;
    "~^/analysis/2023-TTT-wardrobe/?$"             /analysis/2023-ttt-wardrobe/;
    "~^/analysis/2026-03-Archaeologist's-Spade/?$" /analysis/2026-03-archaeologists-spade/;
    "~^/analysis/2025-08-Möbius-ring/?$"           /analysis/2025-08-mobius-ring/;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # nginx redirects /foo to /foo/ for every page. By default it spells that
    # out as http://www.loathers.net/foo/, which bounces https visitors through
    # http first. A relative /foo/ keeps them on whatever they came in on.
    absolute_redirect off;

    # Missing pages get the site's own 404 page (src/pages/404.astro), still
    # with a 404 status. "internal" means /404.html can only be shown this way,
    # so visiting it directly is a 404 too rather than a page that "exists".
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Old post addresses still work, they just land on the new ones
    if ($renamed_post) {
        return 301 $renamed_post;
    }

    # Straight to Open Collective, instead of Astro's meta-refresh redirect page
    location = /contribute {
        return 301 https://opencollective.com/loathers;
    }

    location = /contribute/ {
        return 301 https://opencollective.com/loathers;
    }
}

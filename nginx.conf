server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # nginx redirects /foo to /foo/ for every page. By default it spells that
    # out as http://www.loathers.net/foo/, which bounces https visitors through
    # http first. A relative /foo/ keeps them on whatever they came in on.
    absolute_redirect off;

    # Straight to Open Collective, instead of Astro's meta-refresh redirect page
    location = /contribute {
        return 301 https://opencollective.com/loathers;
    }

    location = /contribute/ {
        return 301 https://opencollective.com/loathers;
    }
}
